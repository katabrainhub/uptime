name: Health ping

# External uptime checks for the katabrain.com services.
#
# WHY THIS REPOSITORY IS PUBLIC. GitHub Actions minutes are unmetered on public
# repositories. An hourly job billed at a one-minute minimum costs 720 minutes a
# month on a private one — a third of a Free-plan allowance, for about two
# minutes of real compute. Nothing here is sensitive: every assertion is about
# responses anyone can request. Add no secrets to this repository.
#
# WHAT THIS IS NOT, because a monitor trusted beyond its accuracy is worse than
# no monitor:
#   - Scheduled workflows on shared runners are queued, not guaranteed. Delays of
#     10-30 minutes are normal and runs can be dropped under load. Real detection
#     latency is "roughly an hour", not "one hour".
#   - If GitHub Actions is degraded, there is no check and no alert.
#   - GitHub disables scheduled workflows after 60 days without repository
#     activity. keepalive.yml exists solely to prevent that. If it is removed or
#     starts failing, this check stops silently — which is the failure mode most
#     worth watching for, because nothing announces it.
#
# Alerting is workflow failure: a red run notifies whoever watches this
# repository. There is no push channel.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # One job checks everything on purpose. Billing is per job-minute, so
      # splitting this would multiply the cost to learn the same facts.
      - name: Ping health endpoints
        shell: bash
        run: |
          set -uo pipefail

          # endpoint|expected token in body
          targets=(
            "https://brain.katabrain.com/health|\"status\":\"ok\""
            "https://agent.katabrain.com/health|\"status\":\"healthy\""
          )

          failures=()
          summary=()

          for target in "${targets[@]}"; do
            url="${target%%|*}"
            expect="${target##*|}"

            # Retry before crying. A single failed request is usually a transient
            # blip, and a monitor that alerts on those gets muted by its reader —
            # at which point it stops being a monitor. Three attempts, 15s apart.
            attempt=0
            ok=0
            code=""
            body=""
            while (( attempt < 3 )); do
              attempt=$((attempt + 1))
              body="$(curl -sS --max-time 20 -w $'\n%{http_code}' "$url" 2>/dev/null || true)"
              code="$(tail -n1 <<<"$body")"
              body="$(sed '$d' <<<"$body")"

              if [[ "$code" == "200" ]] && grep -Fq "$expect" <<<"$body"; then
                ok=1
                break
              fi
              echo "attempt $attempt/3 failed for $url (http=${code:-none})"
              (( attempt < 3 )) && sleep 15
            done

            if (( ok )); then
              echo "OK  $url (http=$code, attempt $attempt)"
              summary+=("| \`$url\` | ✅ ok | $code | $attempt |")
            else
              # Asserting the body, not just the status line: a service can
              # return 200 while reporting an unhealthy payload.
              echo "FAIL $url (http=${code:-none}) body: ${body:0:200}"
              failures+=("$url (http=${code:-none})")
              summary+=("| \`$url\` | ❌ FAILED | ${code:-none} | $attempt |")
            fi
          done

          {
            echo "### Health ping"
            echo
            echo "| endpoint | result | http | attempts |"
            echo "|---|---|---|---|"
            printf '%s\n' "${summary[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failures[@]} > 0 )); then
            {
              echo
              echo "**${#failures[@]} endpoint(s) failed after 3 attempts:**"
              printf -- '- %s\n' "${failures[@]}"
              echo
              echo "A red run means the service was unreachable or unhealthy from outside."
              echo "Check the hosting platform first, then DNS and proxy configuration."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "all endpoints healthy"

      # The exact status codes are the assertion, in BOTH directions:
      #
      #   405 proves the application's own router answered. A redirect here would
      #     mean the API surface has been placed behind an interactive gate, and
      #     every non-browser client is broken.
      #   302 proves an access proxy sits in front of the admin surface. A 401
      #     would mean the request reached the origin instead — which reads like
      #     a working deny to anyone checking only "not 200".
      #
      # So this detects the gate being removed, misconfigured, or applied too
      # widely, none of which produce a symptom anywhere else.
      - name: Assert the service surface
        shell: bash
        run: |
          set -uo pipefail

          # path|expected|why this exact code
          checks=(
            "/.well-known/oauth-authorization-server|200|discovery must stay public for non-browser clients"
            "/.well-known/oauth-protected-resource|200|discovery must stay public for non-browser clients"
            "/mcp|405|the application's own router, not an interactive gate"
            "/token|405|the application's own router, not an interactive gate"
            "/revoke|405|the application's own router, not an interactive gate"
            "/admin|302|the access proxy must be in front; 401 would mean it is not"
            "/admin/api/agents|302|the access proxy must be in front; 401 would mean it is not"
          )

          failures=()
          summary=()

          for check in "${checks[@]}"; do
            IFS='|' read -r path expect why <<<"$check"
            url="https://brain.katabrain.com${path}"

            # Two attempts, same reasoning as above.
            code=""
            for attempt in 1 2; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)"
              [[ "$code" == "$expect" ]] && break
              (( attempt < 2 )) && sleep 10
            done

            if [[ "$code" == "$expect" ]]; then
              echo "OK  $path -> $code"
              summary+=("| \`$path\` | ✅ | $expect | $code |")
            else
              echo "FAIL $path -> ${code:-none}, expected $expect ($why)"
              failures+=("$path returned ${code:-none}, expected $expect — $why")
              summary+=("| \`$path\` | ❌ | $expect | ${code:-none} |")
            fi
          done

          {
            echo "### Service surface"
            echo
            echo "| path | result | expected | got |"
            echo "|---|---|---|---|"
            printf '%s\n' "${summary[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failures[@]} > 0 )); then
            {
              echo
              echo "**${#failures[@]} surface assertion(s) failed:**"
              printf -- '- %s\n' "${failures[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "surface assertions all pass"
